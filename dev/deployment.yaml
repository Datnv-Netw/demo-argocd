apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-dev
  labels:
    app: demo-app
    env: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        env: dev
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: demo-app-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-html
  namespace: demo-dev
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Demo ArgoCD - DEV</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .container {
                text-align: center;
                background: white;
                padding: 50px;
                border-radius: 10px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }
            h1 { color: #667eea; }
            .version { color: #764ba2; font-size: 24px; margin: 20px 0; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 Demo Application - DEV Environment</h1>
            <div class="version">Version: v1.0.0</div>
            <p>Deployed by ArgoCD</p>
            <p>Environment: Development</p>
        </div>
    </body>
    </html>
